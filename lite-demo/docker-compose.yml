services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: some-project:local
    env_file:
      - .env
    environment:
      HTTP_ADDR: ":8080"
      POLICY_PATH: "/policy.json"
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
