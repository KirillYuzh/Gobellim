services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    environment:
      # Single node, security off: this is a local demo, not a production
      # cluster. APP_ENV=prod is rejected by internal/config.
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "${ES_PORT:-9200}:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    volumes:
      - es-data:/usr/share/elasticsearch/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: some-project:local
    env_file:
      - .env
    environment:
      HTTP_ADDR: ":8080"
      POLICY_PATH: "/policy.json"
      ES_URL: "http://elasticsearch:9200"
      ES_INDEX: "lite-demo-runs"
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  es-data:
