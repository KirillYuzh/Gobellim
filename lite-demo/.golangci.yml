version: "2"

run:
  timeout: 5m
  tests: true
  relative-path-mode: gomod

linters:
  default: none
  enable:
    - bodyclose
    - errcheck
    - errorlint
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  settings:
    gosec:
      severity: medium
      confidence: medium
      excludes:
        - G304
        - G204
        - G404
        - G115
        - G301
        - G703
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: superfluous-else
        - name: unreachable-code

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      module-path: some-project

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
