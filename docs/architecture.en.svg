<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-label="Gobellim architecture: a typed task feeds a model, the Gate decides allow, deny or escalate, and only the Gate reaches a tool handler">
  <rect width="1040" height="560" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <style>
    .t { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; }
    .s { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #475569; font-size: 11px; }
    .n { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #0f172a; font-size: 13px; font-weight: 600; }
    .l { stroke: #334155; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    .ld { stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 5 4; fill: none; marker-end: url(#arrow-dashed); }
    .box { fill: #f8fafc; stroke: #334155; stroke-width: 1.6; }
    .allow { fill: #dcfce7; stroke: #166534; stroke-width: 1.6; }
    .escalate { fill: #fef3c7; stroke: #92400e; stroke-width: 1.6; }
    .deny { fill: #fee2e2; stroke: #991b1b; stroke-width: 1.6; }
    .audit { fill: #eef2ff; stroke: #3730a3; stroke-width: 1.6; }
  </style>

  <!-- top row -->
  <rect class="box" x="30" y="40" width="140" height="70" rx="10"/>
  <text class="n" x="100" y="72" text-anchor="middle">HTTP handler</text>
  <text class="s" x="100" y="90" text-anchor="middle">your ctx, your code</text>

  <rect class="box" x="210" y="40" width="190" height="70" rx="10"/>
  <text class="n" x="305" y="66" text-anchor="middle">Task[In, Out]</text>
  <text class="s" x="305" y="84" text-anchor="middle">typed input, labels,</text>
  <text class="s" x="305" y="98" text-anchor="middle">handles, limits</text>

  <rect class="box" x="440" y="40" width="150" height="70" rx="10"/>
  <text class="n" x="515" y="72" text-anchor="middle">model</text>
  <text class="s" x="515" y="90" text-anchor="middle">proposes output or</text>
  <text class="s" x="515" y="104" text-anchor="middle">a tool call</text>

  <rect class="box" x="630" y="30" width="190" height="110" rx="10"/>
  <text class="n" x="725" y="52" text-anchor="middle">Gate</text>
  <text class="s" x="725" y="72" text-anchor="middle">tenant binding</text>
  <text class="s" x="725" y="88" text-anchor="middle">RBAC / ACL</text>
  <text class="s" x="725" y="104" text-anchor="middle">grounding + Validate</text>
  <text class="s" x="725" y="120" text-anchor="middle">effect ceiling</text>

  <line class="l" x1="170" y1="75" x2="206" y2="75"/>
  <line class="l" x1="400" y1="75" x2="436" y2="75"/>
  <line class="l" x1="590" y1="75" x2="626" y2="75"/>

  <!-- gate fan -->
  <line class="l" x1="700" y1="140" x2="205" y2="176"/>
  <line class="l" x1="725" y1="140" x2="725" y2="176"/>
  <line class="l" x1="750" y1="140" x2="935" y2="176"/>

  <!-- outcomes -->
  <rect class="allow" x="90" y="180" width="200" height="54" rx="10"/>
  <text class="n" x="190" y="212" text-anchor="middle">Allow</text>

  <rect class="escalate" x="615" y="180" width="220" height="54" rx="10"/>
  <text class="n" x="725" y="212" text-anchor="middle">Escalate</text>

  <rect class="deny" x="880" y="180" width="130" height="54" rx="10"/>
  <text class="n" x="945" y="212" text-anchor="middle">Deny</text>

  <!-- row 3 -->
  <rect class="box" x="70" y="270" width="240" height="80" rx="10"/>
  <text class="n" x="190" y="302" text-anchor="middle">your tool handler</text>
  <text class="s" x="190" y="322" text-anchor="middle">normal business code</text>
  <text class="s" x="190" y="336" text-anchor="middle">after an Allow only</text>

  <rect class="box" x="595" y="270" width="260" height="80" rx="10"/>
  <text class="n" x="725" y="298" text-anchor="middle">PendingAction</text>
  <text class="s" x="725" y="318" text-anchor="middle">resolved args, digest,</text>
  <text class="s" x="725" y="332" text-anchor="middle">nonce, expiry</text>

  <rect class="deny" x="860" y="270" width="160" height="80" rx="10"/>
  <text class="n" x="940" y="304" text-anchor="middle">nothing runs</text>
  <text class="s" x="940" y="324" text-anchor="middle">audit only</text>

  <line class="l" x1="190" y1="234" x2="190" y2="266"/>
  <line class="l" x1="725" y1="234" x2="725" y2="266"/>
  <line class="l" x1="945" y1="234" x2="942" y2="266"/>

  <!-- row 4 -->
  <rect class="box" x="70" y="400" width="240" height="74" rx="10"/>
  <text class="s" x="190" y="428" text-anchor="middle">result is redacted before</text>
  <text class="s" x="190" y="444" text-anchor="middle">it returns to the model</text>
  <text class="s" x="190" y="460" text-anchor="middle">(secret to handle, PII masked)</text>

  <rect class="allow" x="575" y="400" width="300" height="74" rx="10"/>
  <text class="n" x="725" y="426" text-anchor="middle">human approves</text>
  <text class="s" x="725" y="446" text-anchor="middle">ExecuteApproved: the Gate runs again,</text>
  <text class="s" x="725" y="460" text-anchor="middle">the nonce is single-use</text>

  <line class="l" x1="190" y1="350" x2="190" y2="396"/>
  <line class="l" x1="725" y1="350" x2="725" y2="396"/>

  <!-- approved path back to the tool handler -->
  <path class="l" d="M575,437 L430,437 L430,310 L318,310"/>

  <!-- audit band -->
  <rect class="audit" x="70" y="500" width="950" height="40" rx="10"/>
  <text class="s" x="545" y="525" text-anchor="middle">audit: labels, digests, decisions, latency, token counts — no prompt text, no raw arguments, no secrets</text>
</svg>
