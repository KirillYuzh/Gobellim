<svg xmlns="http://www.w3.org/2000/svg" width="900" height="250" viewBox="0 0 900 250" role="img" aria-label="Путь вызова: authz, guard, span, fn">
<defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444444"/></marker></defs>
<rect width="900" height="250" fill="#FFFFFF"/>
<line x1="210" y1="94" x2="250" y2="94" stroke="#444444" stroke-width="1" marker-end="url(#ar)"/>
<line x1="430" y1="94" x2="470" y2="94" stroke="#444444" stroke-width="1" marker-end="url(#ar)"/>
<line x1="650" y1="94" x2="690" y2="94" stroke="#444444" stroke-width="1" marker-end="url(#ar)"/>
<rect x="30" y="56" width="180" height="76" fill="#FFFFFF" stroke="#444444" stroke-width="1"/>
<text x="120.0" y="89" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111111">authz</text>
<text x="120.0" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#555555">проверка прав</text>
<rect x="250" y="56" width="180" height="76" fill="#FFFFFF" stroke="#444444" stroke-width="1"/>
<text x="340.0" y="89" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111111">guard</text>
<text x="340.0" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#555555">L0, L1, L2</text>
<rect x="470" y="56" width="180" height="76" fill="#FFFFFF" stroke="#444444" stroke-width="1"/>
<text x="560.0" y="89" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111111">span</text>
<text x="560.0" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#555555">запись трейса</text>
<rect x="690" y="56" width="180" height="76" fill="#FFFFFF" stroke="#444444" stroke-width="1"/>
<text x="780.0" y="89" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#111111">fn</text>
<text x="780.0" y="106" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="400" fill="#555555">ваш код</text>
<text x="30" y="30" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#111111">Каждая операция kit идёт одним путём.</text>
<text x="30" y="176" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">Операции: Chat, Ingest, Search, Delete, Score, Generate.</text>
<text x="30" y="202" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">Chat вызывает модель и инструменты в цикле, пока модель не вернёт ответ.</text>
<text x="30" y="228" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#555555">Цикл ограничен: число шагов, лимит вызовов на инструмент, таймаут.</text>
</svg>
