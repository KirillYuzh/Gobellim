# kit lint config; mirrors internal/importrules (I-13, BR-74).

version: "2"

run:
  timeout: 5m
  tests: true
  relative-path-mode: gomod

linters:
  default: none
  enable:
    - bodyclose # HTTP response bodies are closed
    - depguard # import rules (I-13)
    - errcheck # unchecked errors
    - errorlint # error wrapping / errors.Is-As correctness
    - gosec # security (I-13)
    - govet # the vet suite
    - ineffassign # ineffectual assignments
    - misspell # common English misspellings
    - revive # golint successor, minimal ruleset below
    - staticcheck # staticcheck
    - unused # unused code
  settings:
    gosec:
      severity: medium
      confidence: medium
      excludes:
        - G304
        - G204
        - G404
        - G115
        - G301
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: increment-decrement
        - name: indent-error-flow
        - name: range
        - name: superfluous-else
        - name: unreachable-code
    depguard:
      rules:
        core-authz:
          files:
            - "authz/**"
          deny:
            - pkg: github.com/gobellim/kit/guard
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/model
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/embed
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/chunk
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/store
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/trace
              desc: "core-family packages must not import each other (I-13)"
        core-guard:
          files:
            - "guard/**"
          deny:
            - pkg: github.com/gobellim/kit/authz
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/model
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/embed
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/chunk
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/store
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/trace
              desc: "core-family packages must not import each other (I-13)"
        core-model:
          files:
            - "model/**"
          deny:
            - pkg: github.com/gobellim/kit/authz
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/guard
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/embed
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/chunk
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/store
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/trace
              desc: "core-family packages must not import each other (I-13)"
        core-embed:
          files:
            - "embed/**"
          deny:
            - pkg: github.com/gobellim/kit/authz
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/guard
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/model
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/chunk
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/store
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/trace
              desc: "core-family packages must not import each other (I-13)"
        core-chunk:
          files:
            - "chunk/**"
          deny:
            - pkg: github.com/gobellim/kit/authz
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/guard
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/model
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/embed
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/store
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/trace
              desc: "core-family packages must not import each other (I-13)"
        core-store:
          files:
            - "store/**"
          deny:
            - pkg: github.com/gobellim/kit/authz
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/guard
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/model
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/embed
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/chunk
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/trace
              desc: "core-family packages must not import each other (I-13)"
        core-trace:
          files:
            - "trace/**"
          deny:
            - pkg: github.com/gobellim/kit/authz
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/guard
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/model
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/embed
              desc: "core-family packages must not import each other (I-13)"
            - pkg: github.com/gobellim/kit/chunk
              desc: "core-family packages must not import each other (I-13)"

        internal-leaves:
          files:
            - "internal/core/**"
            - "internal/id/**"
            - "internal/httpjson/**"
            - "internal/oauth/**"
            - "internal/ort/**"
            - "internal/ratelimit/**"
            - "internal/cache/**"
            - "internal/importrules/**"
          deny:
            - pkg: github.com/gobellim/kit$
              desc: "internal leaves must not import the kit façade (I-13)"
            - pkg: github.com/gobellim/kit/authz
              desc: "internal leaves may import only internal/** (I-13)"
            - pkg: github.com/gobellim/kit/guard
              desc: "internal leaves may import only internal/** (I-13)"
            - pkg: github.com/gobellim/kit/model
              desc: "internal leaves may import only internal/** (I-13)"
            - pkg: github.com/gobellim/kit/embed
              desc: "internal leaves may import only internal/** (I-13)"
            - pkg: github.com/gobellim/kit/chunk
              desc: "internal leaves may import only internal/** (I-13)"
            - pkg: github.com/gobellim/kit/store
              desc: "internal leaves may import only internal/** (I-13)"
            - pkg: github.com/gobellim/kit/trace
              desc: "internal leaves may import only internal/** (I-13)"
            - pkg: github.com/gobellim/kit/eval
              desc: "internal leaves may import only internal/** (I-13)"
            - pkg: github.com/gobellim/kit/flow
              desc: "internal leaves may import only internal/** (I-13)"
            - pkg: github.com/gobellim/kit/rerank
              desc: "internal leaves may import only internal/** (I-13)"
            - pkg: github.com/gobellim/kit/mcp
              desc: "internal leaves may import only internal/** (I-13)"
            - pkg: github.com/gobellim/kit/webfetch
              desc: "internal leaves may import only internal/** (I-13)"
            - pkg: github.com/gobellim/kit/cmd
              desc: "internal leaves may import only internal/** (I-13)"
            - pkg: github.com/gobellim/kit/demo
              desc: "internal leaves may import only internal/** (I-13)"

        eval:
          files:
            - "eval/**"
          deny:
            - pkg: github.com/gobellim/kit$
              desc: "eval must not import the kit façade (I-13)"
            - pkg: github.com/gobellim/kit/authz
              desc: "eval may import only trace and internal/** (I-13)"
            - pkg: github.com/gobellim/kit/guard
              desc: "eval may import only trace and internal/** (I-13)"
            - pkg: github.com/gobellim/kit/model
              desc: "eval may import only trace and internal/** (I-13)"
            - pkg: github.com/gobellim/kit/embed
              desc: "eval may import only trace and internal/** (I-13)"
            - pkg: github.com/gobellim/kit/chunk
              desc: "eval may import only trace and internal/** (I-13)"
            - pkg: github.com/gobellim/kit/store
              desc: "eval may import only trace and internal/** (I-13)"
            - pkg: github.com/gobellim/kit/cmd
              desc: "eval may import only trace and internal/** (I-13)"
            - pkg: github.com/gobellim/kit/demo
              desc: "eval may import only trace and internal/** (I-13)"

        flow:
          files:
            - "flow/**"
          deny:
            - pkg: github.com/gobellim/kit$
              desc: "flow must not import the kit façade (I-13, cycle risk)"
            - pkg: github.com/gobellim/kit/internal/call
              desc: "flow may import only internal/** leaves, not the call primitive (I-13)"
            - pkg: github.com/gobellim/kit/authz
              desc: "flow must not import the core family (I-13)"
            - pkg: github.com/gobellim/kit/guard
              desc: "flow must not import the core family (I-13)"
            - pkg: github.com/gobellim/kit/model
              desc: "flow must not import the core family (I-13)"
            - pkg: github.com/gobellim/kit/embed
              desc: "flow must not import the core family (I-13)"
            - pkg: github.com/gobellim/kit/chunk
              desc: "flow must not import the core family (I-13)"
            - pkg: github.com/gobellim/kit/store
              desc: "flow must not import the core family (I-13)"
            - pkg: github.com/gobellim/kit/trace
              desc: "flow must not import the core family (I-13)"
            - pkg: github.com/gobellim/kit/eval
              desc: "flow may import only internal/** leaves (I-13)"
            - pkg: github.com/gobellim/kit/rerank
              desc: "flow may import only internal/** leaves (I-13)"
            - pkg: github.com/gobellim/kit/mcp
              desc: "flow may import only internal/** leaves (I-13)"
            - pkg: github.com/gobellim/kit/webfetch
              desc: "flow may import only internal/** leaves (I-13)"
            - pkg: github.com/gobellim/kit/cmd
              desc: "flow may import only internal/** leaves (I-13)"
            - pkg: github.com/gobellim/kit/demo
              desc: "flow may import only internal/** leaves (I-13)"

        internal-no-facade:
          files:
            - "internal/**"
          deny:
            - pkg: github.com/gobellim/kit$
              desc: "no file under internal/ may import the kit façade (I-13, cycle risk)"

  exclusions:
    rules:
      - path: 'cmd/kitctl/(latency|verify)\.go|scripts/guardqual/run\.go'
        linters:
          - staticcheck
        text: "SA4023"
      - path: 'scripts/guardqual/main\.go'
        linters:
          - errcheck

formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      module-path: github.com/gobellim/kit

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
