version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - errorlint
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
    - noctx
    - gosec
  settings:
    gosec:
      severity: medium
      confidence: medium
      excludes:
        # The SQL adapter builds a query from a table name that it validates
        # with a strict identifier regex before use.
        - G201
        - G202

formatters:
  enable:
    - gofmt
