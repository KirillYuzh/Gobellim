apiVersion: 1

datasources:
  - name: kit observations
    uid: kit-observations
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    isDefault: true
    jsonData:
      index: kit-observations
      timeField: "@timestamp"
      esVersion: 8.15.0
      logMessageField: output
      logLevelField: level
    editable: false

  - name: kit traces
    uid: kit-traces
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    jsonData:
      index: kit-traces
      timeField: "@timestamp"
      esVersion: 8.15.0
      logMessageField: output
      logLevelField: level
    editable: false
