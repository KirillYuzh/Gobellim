# Local stack: Elasticsearch (the only datastore, decision D11) + Grafana
# dashboards + the demo bot service. GigaChat is external; pass
# GIGACHAT_CREDENTIALS through the environment.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - KIT_ADDR=:8080
      - KIT_ES_URL=http://elasticsearch:9200
      - KIT_POLICY=/etc/kit/policy.yaml
      - GIGACHAT_CREDENTIALS=${GIGACHAT_CREDENTIALS:-}
      - GIGACHAT_MODEL=${GIGACHAT_MODEL:-GigaChat}
    read_only: true
    depends_on:
      elasticsearch:
        condition: service_healthy

volumes:
  es-data:
