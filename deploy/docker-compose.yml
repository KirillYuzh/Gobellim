# Local stack: Elasticsearch (the only datastore, decision D11) + Grafana
# dashboards + the demo bot service. GigaChat is external; pass
# GIGACHAT_CREDENTIALS through the environment.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      elasticsearch:
        condition: service_healthy

  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.8
    # TEI publishes amd64 only; on Apple Silicon this runs under emulation.
    platform: linux/amd64
    command: ["--model-id", "intfloat/multilingual-e5-small", "--port", "80"]
    ports:
      - "8088:80"
    volumes:
      - tei-data:/data

  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      - "8080:8080"
    environment:
      - KIT_ADDR=:8080
      - KIT_ES_URL=http://elasticsearch:9200
      - KIT_POLICY=/etc/kit/policy.yaml
      - EMBED_BASE_URL=http://embeddings:80/v1
      - EMBED_MODEL=intfloat/multilingual-e5-small
      - EMBED_DIM=384
      - GIGACHAT_CREDENTIALS=${GIGACHAT_CREDENTIALS:-}
      - GIGACHAT_MODEL=${GIGACHAT_MODEL:-GigaChat-2}
    read_only: true
    depends_on:
      elasticsearch:
        condition: service_healthy
      embeddings:
        condition: service_started

volumes:
  es-data:
  tei-data:
