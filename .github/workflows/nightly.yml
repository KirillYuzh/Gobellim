name: nightly

on:
  schedule:
    # The PR loop only type-checks -tags ort; this job actually runs the L2 path.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"
  # Matches the C API headers bundled with github.com/yalue/onnxruntime_go v1.36.0.
  ORT_VERSION: "1.29.0"
  # Matches github.com/daulet/tokenizers v1.27.0 in go.mod.
  TOKENIZERS_VERSION: "v1.27.0"
  GUARD_MODEL: "hivetrace/gliner-guard-omni"
  # The exporter is pinned to the versions it was written against; a newer
  # gliner2 can change the extractor API the export script replays.
  GLINER2_VERSION: "2.1.0"
  TORCH_VERSION: "2.14.0+cpu"
  TRANSFORMERS_VERSION: "5.17.0"
  ONNX_VERSION: "1.23.2"
  ONNXRUNTIME_VERSION: "1.31.0"
  # numpy 2.5.x requires Python >= 3.12.
  NUMPY_VERSION: "2.5.3"
  HUGGINGFACE_HUB_VERSION: "1.32.0"

jobs:
  ort-parity:
    name: ORT parity (L2)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: export the guard model to ONNX
        # The HuggingFace repo ships model.safetensors, not an ONNX graph, so
        # kitctl model pull cannot fetch it. tools/gliner/export.py is the
        # source of the graph and writes the config the Go side reads.
        env:
          HF_HUB_OFFLINE: "0"
        run: |
          set -euo pipefail
          python3 -m pip install --upgrade pip
          python3 -m pip install --extra-index-url https://download.pytorch.org/whl/cpu \
            "torch==${TORCH_VERSION}"
          python3 -m pip install \
            "gliner2==${GLINER2_VERSION}" \
            "transformers==${TRANSFORMERS_VERSION}" \
            "onnx==${ONNX_VERSION}" \
            "onnxruntime==${ONNXRUNTIME_VERSION}" \
            "numpy==${NUMPY_VERSION}" \
            "huggingface_hub==${HUGGINGFACE_HUB_VERSION}"
          python3 tools/gliner/export.py --skip-fixtures --out /tmp/gliner
          mkdir -p models/hivetrace__gliner-guard-omni
          cp /tmp/gliner/model/model.onnx \
             /tmp/gliner/model/tokenizer.json \
             /tmp/gliner/model/config.json \
             models/hivetrace__gliner-guard-omni/

      - name: native libraries
        run: |
          set -euo pipefail
          mkdir -p .ort/lib
          curl -fsSL -o /tmp/onnxruntime.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-linux-x64-${ORT_VERSION}.tgz"
          tar -xzf /tmp/onnxruntime.tgz -C /tmp
          cp /tmp/onnxruntime-linux-x64-${ORT_VERSION}/lib/libonnxruntime.so* .ort/lib/
          curl -fsSL -o /tmp/libtokenizers.tgz \
            "https://github.com/daulet/tokenizers/releases/download/${TOKENIZERS_VERSION}/libtokenizers.linux-amd64.tar.gz"
          tar -xzf /tmp/libtokenizers.tgz -C .ort/lib
          test -f .ort/lib/libtokenizers.a
          test -f .ort/lib/libonnxruntime.so

      # The PR loop only type-checks -tags ort; this is where the ML path is
      # actually executed. Same native runtime as the parity gate below.
      - name: ort-tagged tests (embed, guard)
        env:
          CGO_ENABLED: "1"
          CGO_LDFLAGS: -L${{ github.workspace }}/.ort/lib
          KIT_ORT_LIB: ${{ github.workspace }}/.ort/lib/libonnxruntime.so
        run: |
          go test -tags ort -count=1 ./embed/... ./guard/...
      - name: parity gate
        env:
          CGO_ENABLED: "1"
          CGO_LDFLAGS: -L${{ github.workspace }}/.ort/lib
          KIT_ORT_LIB: ${{ github.workspace }}/.ort/lib/libonnxruntime.so
        run: |
          go -C cmd run -tags ort ./kitctl verify parity \
            --dir ../models \
            --fixtures ../guard/gliner/testdata \
            --min-agreement 1.0

  fuzz:
    name: fuzz (short run)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The fuzz targets only ever ran as ordinary seed tests. This job lets
      # the fuzzer explore them for a bounded time; pure Go, no native runtime.
      - name: go test -fuzz (store, guard)
        run: |
          set -euo pipefail
          go test -run '^$' -fuzz=FuzzCompileFilter -fuzztime=30s ./store/
          go test -run '^$' -fuzz=FuzzRRF -fuzztime=30s ./store/
          go test -run '^$' -fuzz=FuzzCanonicalize -fuzztime=30s ./guard/
          go test -run '^$' -fuzz=FuzzDecodedVariants -fuzztime=30s ./guard/
