name: ci

on:
  push:
    branches:
      - develop
      - main
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.24"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test
        run: go test ./... -count=1
      - name: import rules (I-13)
        run: go test ./internal/importrules/ -run TestImportRules -v

  race:
    name: race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test -race
        run: go test -race -count=1 ./trace/... ./guard/... ./eval/... ./internal/...

  ort-vet:
    name: ort-vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet -tags ort (type-check only)
        run: go vet -tags ort ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0
          verify: true

  fumpt:
    name: fumpt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: install gofumpt
        run: go install mvdan.cc/gofumpt@v0.7.0
      - name: gofumpt -l
        run: |
          out="$(gofumpt -l .)"
          if [ -n "$out" ]; then
            echo "gofumpt: the following files need formatting:"
            echo "$out"
            echo "run 'gofumpt -w .' to fix"
            exit 1
          fi

  docs-lint:
    name: docs-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: docs-lint
        run: go run ./scripts/docslint

  guard-quality:
    name: guard quality (L1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      # The ONNX weights are deliberately not in git, so this gate measures the
      # L1 regex layer only. The L2 parity gate needs -tags ort and the runtime.
      - name: guard quality report
        run: |
          set -o pipefail
          go run ./scripts/guardqual | tee guard-quality.md
      - name: publish report to the job summary
        if: always()
        run: cat guard-quality.md >> "$GITHUB_STEP_SUMMARY"
