name: ci

on:
  push:
    branches:
      - develop
      - main
  pull_request:
  # A rerun without an empty commit.
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.26"

jobs:
  test:
    name: build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./... -race -shuffle=on -count=1
      - run: go test . -run '^$' -bench . -benchtime=1x
      - run: go test ./internal/importrules/ -v

  minimum:
    name: minimum go version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          # The go directive in go.mod: a library that needs the newest
          # toolchain loses integrations for nothing.
          go-version: "1.24.x"
          cache: true
      - run: go build ./...
      - run: go vet ./...
      - run: go test . ./flow ./store/sql ./internal/... -race -shuffle=on -count=1

  tidy:
    name: tidy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go mod tidy -diff

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0
          verify: true

  fumpt:
    name: gofumpt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go install mvdan.cc/gofumpt@v0.7.0
      - run: test -z "$(gofumpt -l .)"

  vuln:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
      - run: govulncheck ./...
