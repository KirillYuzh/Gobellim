name: ci

on:
  push:
    branches:
      - develop
      - main
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: "1.24"

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test
        run: go test ./... -count=1
      - name: import rules (I-13)
        run: go test ./internal/importrules/ -run TestImportRules -v

  race:
    name: race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go test -race
        run: go test -race -count=1 ./trace/... ./guard/... ./eval/... ./internal/...

  ort-vet:
    name: ort-vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet -tags ort (type-check only)
        run: go vet -tags ort ./...

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.0
          verify: true

  fumpt:
    name: fumpt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: install gofumpt
        run: go install mvdan.cc/gofumpt@v0.7.0
      - name: gofumpt -l
        run: |
          out="$(gofumpt -l .)"
          if [ -n "$out" ]; then
            echo "gofumpt: the following files need formatting:"
            echo "$out"
            echo "run 'gofumpt -w .' to fix"
            exit 1
          fi
